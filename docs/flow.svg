<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="820" fill="#ffffff"/>

  <text x="460" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">How Xpro runs</text>
  <text x="460" y="70" text-anchor="middle" font-size="14" fill="#475569">The same loop twice: once to do the work, once to find out whether the work was any good</text>

  <text x="215" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">xpro run / serve — the agent loop</text>
  <text x="675" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">xpro eval — the measurement loop</text>

  <!-- ══════════ left column: the agent loop ══════════ -->
  <g>
    <rect x="50" y="140" width="330" height="52" rx="26" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="215" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">task</text>
    <text x="215" y="182" text-anchor="middle" font-size="11" fill="#0369a1">xpro run "fix the failing test"</text>

    <rect x="50" y="216" width="330" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="66" y="238" font-size="14" font-weight="700" fill="#312e81">Session</text>
    <text x="66" y="256" font-size="11" fill="#64748b">append user turn · history · compaction</text>

    <rect x="50" y="292" width="330" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="66" y="314" font-size="14" font-weight="700" fill="#312e81">Model.complete</text>
    <text x="66" y="332" font-size="11" fill="#64748b">messages + tool specs → OpenAI / Anthropic</text>

    <rect x="50" y="368" width="330" height="44" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="215" y="395" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">tool calls in the response?</text>

    <rect x="50" y="444" width="330" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="66" y="466" font-size="14" font-weight="700" fill="#312e81">Policy.check</text>
    <text x="66" y="484" font-size="11" fill="#64748b">mode · hooks · allowlist — gated at execution</text>

    <rect x="50" y="520" width="330" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="66" y="542" font-size="14" font-weight="700" fill="#312e81">Tool execute</text>
    <text x="66" y="560" font-size="11" fill="#64748b">read · edit · search · run_command (root-confined)</text>

    <rect x="50" y="596" width="330" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="66" y="618" font-size="14" font-weight="700" fill="#312e81">tool_result → session</text>
    <text x="66" y="636" font-size="11" fill="#64748b">every id paired back — failures included</text>

    <rect x="50" y="686" width="330" height="52" rx="26" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="215" y="712" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">done</text>
    <text x="215" y="728" text-anchor="middle" font-size="11" fill="#0369a1">finalText · exit ≠ 0 if it hit the round cap</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="215" y1="192" x2="215" y2="214"/>
    <line x1="215" y1="268" x2="215" y2="290"/>
    <line x1="215" y1="344" x2="215" y2="366"/>
    <line x1="215" y1="412" x2="215" y2="442"/>
    <line x1="215" y1="496" x2="215" y2="518"/>
    <line x1="215" y1="572" x2="215" y2="594"/>
    <!-- loop back into the model call -->
    <path d="M50,622 H34 V318 H48"/>
    <!-- the model stopped asking for tools -->
    <path d="M380,390 H396 V712 H384"/>
  </g>
  <text x="222" y="434" font-size="11.5" font-weight="600" fill="#b45309">yes</text>
  <text x="400" y="386" font-size="11.5" font-weight="600" fill="#b45309">no</text>
  <text x="19" y="470" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 19 470)">next round · capped at maxRounds</text>

  <!-- ══════════ right column: the eval loop ══════════ -->
  <g>
    <rect x="510" y="140" width="330" height="52" rx="26" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
    <text x="675" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">evals/suite.json</text>
    <text x="675" y="182" text-anchor="middle" font-size="11" fill="#be185d">cases: repo-derived + authored</text>

    <rect x="510" y="216" width="330" height="52" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
    <text x="526" y="238" font-size="14" font-weight="700" fill="#581c87">for each case × N rollouts</text>
    <text x="526" y="256" font-size="11" fill="#64748b">independent samples, not one long run</text>

    <rect x="510" y="292" width="330" height="52" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
    <text x="526" y="314" font-size="14" font-weight="700" fill="#581c87">workspace.reset()</text>
    <text x="526" y="332" font-size="11" fill="#64748b">back to the pristine commit — no leftovers</text>

    <rect x="510" y="368" width="330" height="52" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
    <text x="526" y="390" font-size="14" font-weight="700" fill="#581c87">fresh agent</text>
    <text x="526" y="408" font-size="11" fill="#64748b">new session; a reused one leaks the last try</text>

    <rect x="510" y="444" width="330" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="526" y="466" font-size="14" font-weight="700" fill="#312e81">run the agent loop</text>
    <text x="526" y="484" font-size="11" fill="#64748b">◀ exactly the flow on the left</text>

    <rect x="510" y="520" width="330" height="52" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
    <text x="526" y="542" font-size="14" font-weight="700" fill="#581c87">workspace.diff()</text>
    <text x="526" y="560" font-size="11" fill="#64748b">the objective record of what changed</text>

    <rect x="510" y="596" width="330" height="52" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
    <text x="526" y="618" font-size="14" font-weight="700" fill="#581c87">scorer / llmJudge</text>
    <text x="526" y="636" font-size="11" fill="#64748b">read-only judge; sees the diff, not the report</text>

    <rect x="510" y="686" width="330" height="52" rx="26" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
    <text x="675" y="712" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">report</text>
    <text x="675" y="728" text-anchor="middle" font-size="11" fill="#be185d">mean · stddev · completion rate</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="675" y1="192" x2="675" y2="214"/>
    <line x1="675" y1="268" x2="675" y2="290"/>
    <line x1="675" y1="344" x2="675" y2="366"/>
    <line x1="675" y1="420" x2="675" y2="442"/>
    <line x1="675" y1="496" x2="675" y2="518"/>
    <line x1="675" y1="572" x2="675" y2="594"/>
    <line x1="675" y1="648" x2="675" y2="684"/>
    <!-- next rollout -->
    <path d="M840,622 H872 V242 H842"/>
    <!-- same loop as the left panel -->
    <path d="M508,470 H434" stroke-dasharray="5 4"/>
  </g>
  <text x="856" y="440" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 856 440)">next rollout · next case</text>

  <text x="460" y="784" text-anchor="middle" font-size="12.5" fill="#64748b">One run measures luck. The spread across runs measures reliability — the number you can actually build on.</text>
  <text x="460" y="804" text-anchor="middle" font-size="12.5" fill="#94a3b8">Nothing in the right column reads the agent's own account of its work; only the diff it left behind.</text>
</svg>
